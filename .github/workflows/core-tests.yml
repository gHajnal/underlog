name: Core tests

on:
  push:
    paths:
      - "UnderlogCore/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "UnderlogCore/**"
  workflow_dispatch:

jobs:
  test:
    name: Swift tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test --package-path UnderlogCore
