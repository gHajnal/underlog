name: Core tests

on:
  push:
    paths:
      - "UnderlogCore/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "UnderlogCore/**"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path UnderlogCore 2>&1 | tee test.log || {
            # Surface compiler errors and failed expectations as annotations so they show up on the run.
            # One annotation per chunk of lines (GitHub keeps at most 10 error annotations per step).
            grep -E "^/.*error:|✘|recorded an issue" test.log | sort -u | head -60 \
              | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); gsub(/\r/,""); print $0 "%0A"; if (NR%6==0) print "\n"} END{print "\n"}' \
              | while IFS= read -r chunk; do [ -n "$chunk" ] && echo "::error::${chunk}"; done
            exit 1
          }
