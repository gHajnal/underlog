name: iOS app

# macOS runners count 10x against the free Actions minutes on private repositories,
# so the app build only runs when app code changes, and UI tests only on request
# (manually from the Actions tab, or by putting [ui-tests] in a commit message).
# Changes to UITests/ alone don't trigger a macOS build; run them from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "UnderlogCore/Sources/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run the UI tests in the simulator"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push cancels a macOS run still in progress, so minutes aren't spent on outdated code.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    # A UI-test run builds the app anyway, so skip the separate build then.
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[ui-tests]'))
      || (github.event_name == 'workflow_dispatch' && !inputs.run_ui_tests)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project Underlog.xcodeproj \
            -scheme Underlog \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u | head -60 \
              | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); print $0 "%0A"; if (NR%6==0) print "\n"} END{print "\n"}' \
              | while IFS= read -r chunk; do [ -n "$chunk" ] && echo "::error::${chunk}"; done
            tail -30 build.log
            exit 1
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  ui-tests:
    name: UI tests
    # Runs when started manually with the box ticked, or when a pushed commit message contains [ui-tests].
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_ui_tests)
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-tests]'))
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -project Underlog.xcodeproj \
            -scheme Underlog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || true
          if ! grep -q "TEST SUCCEEDED" test.log; then
            grep -E "error:|failed" test.log | sort -u | head -60 \
              | awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); print $0 "%0A"; if (NR%6==0) print "\n"} END{print "\n"}' \
              | while IFS= read -r chunk; do [ -n "$chunk" ] && echo "::error::${chunk}"; done
            exit 1
          fi
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
